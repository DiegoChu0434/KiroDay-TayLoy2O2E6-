      #flujo-alertas-dataflow-full-root { font-family: var(--font-sans); color: var(--color-ink); }
      #flujo-alertas-dataflow-full-root .container { max-width: 1200px; margin: 0 auto; }
      #flujo-alertas-dataflow-full-root .header-eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.75rem; }
      #flujo-alertas-dataflow-full-root .brand-bar { display: flex; gap: 5px; margin-bottom: 0.9rem; }
      #flujo-alertas-dataflow-full-root .brand-bar span { height: 6px; border-radius: 3px; }
      #flujo-alertas-dataflow-full-root .brand-bar span:first-child { width: 68px; background: var(--color-accent); }
      #flujo-alertas-dataflow-full-root .brand-bar span:last-child { width: 24px; background: var(--color-yellow); }
      #flujo-alertas-dataflow-full-root .masthead { display: flex; align-items: flex-start; justify-content: space-between; gap: 2rem; }
      #flujo-alertas-dataflow-full-root .masthead-text { flex: 1; }
      #flujo-alertas-dataflow-full-root .brand-logo { flex-shrink: 0; width: 112px; height: 112px; border-radius: 12px; display: block; }
      #flujo-alertas-dataflow-full-root .subtitle { font-size: 1rem; line-height: 1.55; color: var(--color-muted); max-width: 56ch; }
      #flujo-alertas-dataflow-full-root .diagram-container { background: transparent; border: none; padding: 0; overflow-x: auto; }
      #flujo-alertas-dataflow-full-root .diagram-container { overflow-x: visible; }
      #flujo-alertas-dataflow-full-root .card-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.875rem; padding-bottom: 0.875rem; border-bottom: 1px solid rgba(16,36,26,0.08); }
      #flujo-alertas-dataflow-full-root .card-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
      #flujo-alertas-dataflow-full-root .card-dot.accent { background: var(--color-accent); }
      #flujo-alertas-dataflow-full-root .card-dot.ink { background: var(--color-ink); }
      #flujo-alertas-dataflow-full-root .card-dot.link { background: var(--color-link); }</style>
