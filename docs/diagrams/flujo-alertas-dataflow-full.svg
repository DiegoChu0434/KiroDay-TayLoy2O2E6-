<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 728 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flujo-alertas-full-title flujo-alertas-full-desc" id="flujo-alertas-dataflow-full-root">
        <title id="flujo-alertas-full-title">Flujo de alertas de integración AS/400 a SAP</title>
        <desc id="flujo-alertas-full-desc">Pipeline serverless en AWS que ingiere el CSV de errores HA00, clasifica por causa raíz, detecta en CloudWatch, sintetiza la narrativa con Bedrock y entrega un correo consolidado por SES.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #flujo-alertas-dataflow-full-root { --color-paper:   #fafaf7;
