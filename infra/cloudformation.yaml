AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Sistema de alertas para errores de integracion AS/400 -> SAP (tabla HA00).
  Detecta nuevos CSV de errores en S3, los clasifica por causa raiz, emite
  metricas a CloudWatch, dispara alarmas y envia un unico correo estructurado
  via SNS + SES. Alerta diferenciada para STOCK/ATP.

# ---------------------------------------------------------------------------
Parameters:
  RawBucketName:
    Type: String
    Default: tailoy-poc-s3-bucket-raw
    Description: Bucket S3 existente donde aterrizan los CSV de errores HA00.

  ErrorPrefix:
    Type: String
    Default: tai-loy/maestro/raw/ASPRD.ha00/
    Description: Prefijo (carpeta) donde se depositan los CSV de errores.

  SesSender:
    Type: String
    Description: Correo remitente verificado en SES (From).

  SesRecipient:
    Type: String
    Description: Correo destino (bandeja personal) de las alertas.

  MetricNamespace:
    Type: String
    Default: TaiLoy/IntegracionAS400SAP
    Description: Namespace de metricas custom en CloudWatch.

  ModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-5-5
    Description: >
      Inference profile de Bedrock para redactar la narrativa (NUNCA el modelId
      plano: la org bloquea foundation-models directos via SCP y el modelId plano
      falla con on-demand throughput isn't supported).

  CriticalThreshold:
    Type: Number
    Default: 1
    Description: Umbral minimo de errores CRITICOS para disparar la alarma.

# ---------------------------------------------------------------------------
Resources:

  # --- IAM: rol para la Lambda analizadora ---
  AnalyzerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-analyzer-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: analyzer-permissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${RawBucketName}/${ErrorPrefix}*"
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic

  # --- IAM: rol para la Lambda formateadora de correo ---
  EmailFormatterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-email-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: email-permissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ses:SendEmail
                Resource: "*"
              # Bedrock: el inference profile us.* es cross-region, por eso se
              # permite tanto el inference-profile como los foundation-models.
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/${ModelId}"
                  - "arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-5-5"

  # --- SNS: topic de alertas ---
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alertas"
      DisplayName: Alertas AS400-SAP

  # --- SES: identidades (requieren verificacion manual por email) ---
  SesSenderIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SesSender

  SesRecipientIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SesRecipient

  # --- Lambda analizadora ---
  AnalyzerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-analyzer"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt AnalyzerRole.Arn
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          METRIC_NAMESPACE: !Ref MetricNamespace
          SNS_TOPIC_ARN: !Ref AlertTopic
      Code:
        ZipFile: |
          import csv, io, json, os, re, logging
          from collections import defaultdict
          from datetime import datetime, timezone
          import boto3
          logger = logging.getLogger(); logger.setLevel(logging.INFO)
          s3 = boto3.client("s3"); cloudwatch = boto3.client("cloudwatch"); sns = boto3.client("sns")
          NS = os.environ.get("METRIC_NAMESPACE", "TaiLoy/IntegracionAS400SAP")
          TOPIC = os.environ.get("SNS_TOPIC_ARN", "")
          COL_DOC, COL_MSG, COL_FECHA = 3, 4, 7
          RULES = [
            ("PARTNER_FUNCTIONS_FALTANTES","CRITICA",re.compile(r"determinar el (pagador|receptor|solicitante|destinatario)",re.I),"Datos Maestros"),
            ("DATOS_CLIENTE_INCOMPLETOS","CRITICA",re.compile(r"Valor de Cliente es obligatorio",re.I),"Datos Maestros / Integracion"),
            ("CLIENTE_SIN_MAESTRO_VENTAS_KNVV","WARNING",re.compile(r"Falta tabla maestra de clientes KNVV",re.I),"Datos Maestros"),
            ("DEUDOR_INEXISTENTE","WARNING",re.compile(r"El deudor .* no existe",re.I),"Datos Maestros"),
            ("STOCK_INSUFICIENTE_ATP","INFO",re.compile(r"util\.?\s*libre por debajo",re.I),"Operaciones"),
            ("MATERIAL_BLOQUEADO","INFO",re.compile(r"estan bloqueados por el usuario",re.I),"Transitorio"),
            ("CUENTA_MAYOR_INEXISTENTE","WARNING",re.compile(r"cta\.?\s*mayor .* no existe",re.I),"Contabilidad"),
          ]
          STOCK = "STOCK_INSUFICIENTE_ATP"
          # Runbooks de solucion por causa raiz (determinista; definido por el analista)
          RUNBOOKS={
            "PARTNER_FUNCTIONS_FALTANTES":{"pasos":["Se crea una venta para el canal e-commerce (RAPPI / PedidosYa) atendida en tienda.","Al subir a SAP, el cliente (BP) no tiene asignada el area de ventas del canal e-commerce.","Ampliar en SAP a este cliente al canal E-COMMERCE (u otro no ampliado).","Volver a pasar la venta: se contabiliza."],"sistemas":"AS400 / e-commerce (RAPPI, PedidosYa) / SAP (BP, area de ventas)","area_responsable":"Datos Maestros"},
            "DATOS_CLIENTE_INCOMPLETOS":{"pasos":["Al crear un cliente en SAP debe tener el VENDEDOR asignado.","Modificar el cliente en SAP y asignar un vendedor.","Volver a enviar el cliente."],"sistemas":"SAP (maestro de cliente)","area_responsable":"Datos Maestros / Comercial"},
            "STOCK_INSUFICIENTE_ATP":{"pasos":["Venta facturada de una tienda; el cliente ya se llevo el producto (habia stock en tienda).","Al contabilizar en SAP no hay stock: la tienda recibio la mercaderia pero no aplico el ingreso a su almacen.","Ingresar la mercaderia en la tienda y enviar ese movimiento de ingreso a SAP.","Ingresado y contabilizado en SAP, se puede contabilizar la venta pendiente."],"sistemas":"Tienda (ingreso de mercaderia) / SAP (stock, ATP)","area_responsable":"Operaciones / Logistica tienda"},
            "DEUDOR_INEXISTENTE":{"pasos":["Al asignar linea de credito en tienda, el cliente se convierte en deudor.","Una venta al credito (sistema NO SAP) no contabiliza porque el BP no tiene ampliado el ROL DEUDOR.","Ingresar a SAP el BP y asignar el ROL DEUDOR.","Enviar la venta al credito: pasa a contabilizarse."],"sistemas":"Tienda (credito) / SAP (BP, rol deudor)","area_responsable":"Datos Maestros / Creditos"},
            "CLIENTE_SIN_MAESTRO_VENTAS_KNVV":{"pasos":["Pendiente de procedimiento del analista. Escalar a Datos Maestros para completar la vista de area de ventas (KNVV) del cliente."],"sistemas":"SAP (maestro de ventas KNVV)","area_responsable":"Datos Maestros"},
            "MATERIAL_BLOQUEADO":{"pasos":["Pendiente de procedimiento del analista. Transitorio: reintentar cuando el material deje de estar bloqueado por el usuario."],"sistemas":"SAP (datos de centro del material)","area_responsable":"Datos Maestros / Operaciones"},
            "CUENTA_MAYOR_INEXISTENTE":{"pasos":["Pendiente de procedimiento del analista. Escalar a Contabilidad para crear/validar la cuenta de mayor."],"sistemas":"SAP (plan de cuentas)","area_responsable":"Contabilidad"},
            "OTRO":{"pasos":["Sin categorizar. Requiere revision manual y definicion de procedimiento."],"sistemas":"Por determinar","area_responsable":"Revision manual"},
          }
          def runbook(c): return RUNBOOKS.get(c,{"pasos":["Sin procedimiento definido."],"sistemas":"Por determinar","area_responsable":"Revision manual"})
          def classify(m):
            m=(m or "").strip()
            for c,s,rx,eq in RULES:
              if rx.search(m): return c,s,eq
            return "OTRO","WARNING","Revision manual"
          def cliente(doc,msg):
            x=re.search(r"Cliente\s+(\d+)",msg or "",re.I)
            if x: return x.group(1)
            x=re.search(r"deudor\s+(\S+)",msg or "",re.I)
            if x: return x.group(1)
            doc=(doc or "").strip()
            return doc.split("-")[0] if "-" in doc else (doc or "DESCONOCIDO")
          def parse(body):
            rows=list(csv.reader(io.StringIO(body),delimiter="|"))
            out=[]
            for cols in rows[1:]:
              if len(cols)<=COL_MSG: continue
              msg=cols[COL_MSG].strip(); doc=cols[COL_DOC].strip() if len(cols)>COL_DOC else ""
              c,s,eq=classify(msg)
              out.append({"documento":doc,"mensaje":msg,"categoria":c,"severidad":s,"equipo":eq,"cliente":cliente(doc,msg)})
            return out
          def summarize(regs,bucket,key):
            por=defaultdict(int); sev={}; equ={}; clis=defaultdict(set); stock=[]
            for r in regs:
              c=r["categoria"]; por[c]+=1; sev[c]=r["severidad"]; equ[c]=r["equipo"]; clis[c].add(r["cliente"])
              if c==STOCK: stock.append({"documento":r["documento"],"mensaje":r["mensaje"]})
            dpc=defaultdict(lambda:defaultdict(int))
            for r in regs: dpc[r["cliente"]][r["categoria"]]+=1
            top=sorted(({"cliente":k,"total":sum(v.values()),"categorias":dict(v)} for k,v in dpc.items()),key=lambda x:x["total"],reverse=True)[:15]
            cats=[{"categoria":c,"conteo":n,"severidad":sev.get(c,"WARNING"),"equipo":equ.get(c,"Revision manual"),"clientes_afectados":len(clis.get(c,set())),"solucion":runbook(c)} for c,n in sorted(por.items(),key=lambda x:x[1],reverse=True)]
            return {"lote":{"bucket":bucket,"key":key,"procesado_utc":datetime.now(timezone.utc).isoformat(),"total_errores":len(regs),"clientes_afectados":len({r["cliente"] for r in regs})},"categorias":cats,"alerta_stock":{"categoria":STOCK,"conteo":por.get(STOCK,0),"documentos":stock[:50]},"top_clientes":top}
          def metrics(sm):
            md=[{"MetricName":"ErroresPorCategoria","Dimensions":[{"Name":"Categoria","Value":c["categoria"]},{"Name":"Severidad","Value":c["severidad"]}],"Value":c["conteo"],"Unit":"Count"} for c in sm["categorias"]]
            md.append({"MetricName":"TotalErroresLote","Value":sm["lote"]["total_errores"],"Unit":"Count"})
            if md: cloudwatch.put_metric_data(Namespace=NS,MetricData=md)
          def publish(sm):
            if TOPIC: sns.publish(TopicArn=TOPIC,Subject="Alerta errores integracion AS400-SAP",Message=json.dumps(sm,ensure_ascii=False))
          def handler(event,context):
            res=[]
            for rec in event.get("Records",[]):
              b=rec["s3"]["bucket"]["name"]; k=rec["s3"]["object"]["key"]
              body=s3.get_object(Bucket=b,Key=k)["Body"].read().decode("latin-1")
              sm=summarize(parse(body),b,k)
              logger.info("RESUMEN_LOTE %s",json.dumps(sm,ensure_ascii=False))
              metrics(sm); publish(sm); res.append({"key":k,"total":sm["lote"]["total_errores"]})
            return {"statusCode":200,"procesados":res}

  # --- Lambda formateadora de correo ---
  EmailFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-email"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt EmailFormatterRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          SES_SENDER: !Ref SesSender
          SES_RECIPIENT: !Ref SesRecipient
          MODEL_ID: !Ref ModelId
          BEDROCK_MAX_TOKENS: "350"
      Code:
        ZipFile: |
          import json, os, logging
          import boto3
          from botocore.config import Config
          logger=logging.getLogger(); logger.setLevel(logging.INFO)
          ses=boto3.client("ses")
          # cliente Bedrock con timeouts por debajo del timeout de la Lambda (30s)
          bedrock=boto3.client("bedrock-runtime",config=Config(connect_timeout=3,read_timeout=12,retries={"max_attempts":1}))
          SENDER=os.environ.get("SES_SENDER",""); RECIP=os.environ.get("SES_RECIPIENT","")
          MODEL_ID=os.environ.get("MODEL_ID","us.anthropic.claude-sonnet-5-5")
          MAXTOK=int(os.environ.get("BEDROCK_MAX_TOKENS","350"))
          COLOR={"CRITICA":"#c0392b","WARNING":"#e67e22","INFO":"#2980b9"}
          SYS="Eres un asistente de operaciones de datos maestros de Tai Loy que redacta alertas accionables para la integracion AS/400 -> SAP. Escribe en espanol, tono profesional y directo. NUNCA inventes ni recalcules cifras: usa EXCLUSIVAMENTE los numeros entregados."
          def prompt(sm):
            lote=sm["lote"]; cats="; ".join(f"{c['categoria']}={c['conteo']} ({c['severidad']}, responsable {c.get('solucion',{}).get('area_responsable',c['equipo'])})" for c in sm["categorias"])
            return (f"Datos del lote (NO los modifiques):\n- Total errores: {lote['total_errores']}\n- Clientes afectados: {lote['clientes_afectados']}\n- Categorias: {cats}\n- Stock/ATP diferenciada: {sm.get('alerta_stock',{}).get('conteo',0)}\n\nRedacta en espanol, texto plano, dos secciones breves:\n1) RESUMEN EJECUTIVO: 2-4 frases.\n2) PROXIMA ACCION: una vineta por area responsable.\nNo inventes cifras ni procedimientos. No incluyas tablas. Maximo 180 palabras.")
          def narr_fallback(sm):
            cats=sm["categorias"]; crit=[c for c in cats if c["severidad"]=="CRITICA"]
            L=[f"RESUMEN EJECUTIVO: El lote presenta {sm['lote']['total_errores']} errores que afectan a {sm['lote']['clientes_afectados']} clientes."]
            if crit:
              t=max(crit,key=lambda c:c["conteo"]); L.append(f" La causa critica predominante es {t['categoria']} ({t['conteo']} casos), responsabilidad de {t['equipo']}.")
            else: L.append(" No hay categorias criticas en este lote.")
            L.append("\n\nPROXIMA ACCION:"); eq={}
            for c in cats: eq.setdefault(c["equipo"],[]).append(c)
            for e,li in eq.items(): L.append("\n- "+e+": revisar "+", ".join(f"{c['categoria']} ({c['conteo']})" for c in li)+".")
            return "".join(L)
          def narr_ia(sm):
            try:
              r=bedrock.converse(modelId=MODEL_ID,system=[{"text":SYS}],messages=[{"role":"user","content":[{"text":prompt(sm)}]}],inferenceConfig={"maxTokens":MAXTOK})
              b=r.get("output",{}).get("message",{}).get("content",[])
              t="".join(x["text"] for x in b if "text" in x).strip()
              if not t: raise ValueError("vacio")
              logger.info("Narrativa IA usage=%s",r.get("usage")); return t,"IA"
            except Exception as e:
              logger.warning("Bedrock no disponible (%s); fallback.",e); return narr_fallback(sm),"fallback"
          def narr_html(t,o):
            et="redactado por IA (Bedrock / Claude Sonnet 5.5)" if o=="IA" else "generado por plantilla de respaldo"
            return f"<div style='background:#eef5fb;border-left:4px solid #2980b9;padding:12px 14px;margin:12px 0;border-radius:4px'><div style='font-size:14px;line-height:1.5'>{t.replace(chr(10),'<br>')}</div><div style='color:#999;font-size:11px;margin-top:8px'>{et}</div></div>"
          def runbooks_html(sm):
            bl=[]
            for c in sm["categorias"]:
              sol=c.get("solucion")
              if not sol: continue
              col=COLOR.get(c["severidad"],"#555"); ps="".join(f"<li style='margin:2px 0'>{p}</li>" for p in sol.get("pasos",[]))
              bl.append(f"<div style='border:1px solid #e1e4e8;border-radius:6px;padding:12px 14px;margin:10px 0'><div style='font-weight:600'>{c['categoria']} <span style='color:#fff;background:{col};padding:1px 7px;border-radius:3px;font-size:11px'>{c['severidad']}</span> <span style='color:#777;font-weight:400'>- {c['conteo']} casos</span></div><div style='font-size:12px;color:#555;margin:4px 0'><strong>Responsable:</strong> {sol.get('area_responsable','-')} | <strong>Sistemas:</strong> {sol.get('sistemas','-')}</div><ol style='font-size:13px;margin:6px 0 0 18px;padding:0'>{ps}</ol></div>")
            return "<h3>Procedimiento de solucion por causa raiz</h3><p style='margin:4px 0;color:#555;font-size:13px'>Pasos definidos por el analista. Las categorias pendientes aun no tienen procedimiento asignado.</p>"+"".join(bl)
          def rc(c):
            col=COLOR.get(c["severidad"],"#555")
            return f"<tr><td style='padding:6px 10px;border-bottom:1px solid #eee'>{c['categoria']}</td><td style='padding:6px 10px;border-bottom:1px solid #eee;text-align:right'>{c['conteo']}</td><td style='padding:6px 10px;border-bottom:1px solid #eee'><span style='color:#fff;background:{col};padding:2px 8px;border-radius:3px;font-size:12px'>{c['severidad']}</span></td><td style='padding:6px 10px;border-bottom:1px solid #eee'>{c['equipo']}</td><td style='padding:6px 10px;border-bottom:1px solid #eee;text-align:right'>{c['clientes_afectados']}</td></tr>"
          def rcl(c):
            cats=", ".join(f"{k} ({v})" for k,v in c["categorias"].items())
            return f"<tr><td style='padding:6px 10px;border-bottom:1px solid #eee'>{c['cliente']}</td><td style='padding:6px 10px;border-bottom:1px solid #eee;text-align:right'>{c['total']}</td><td style='padding:6px 10px;border-bottom:1px solid #eee'>{cats}</td></tr>"
          def html(sm,nb):
            lote=sm["lote"]; url=f"https://{lote['bucket']}.s3.amazonaws.com/{lote['key']}"
            cr="".join(rc(c) for c in sm["categorias"]); clr="".join(rcl(c) for c in sm["top_clientes"])
            st=sm.get("alerta_stock",{}); sc=st.get("conteo",0); sd=st.get("documentos",[])
            si="".join(f"<li><code>{d['documento']}</code> - {d['mensaje']}</li>" for d in sd[:20])
            ss=f"<h3 style='color:#2980b9'>Alerta diferenciada - Stock/ATP ({sc})</h3><p style='color:#555'>Errores de disponibilidad (no son fallas de migracion). Mostrando primeros {min(20,len(sd))} de {sc}.</p><ul style='font-size:13px'>{si or '<li>Sin casos.</li>'}</ul>"
            return f"<html><body style='font-family:Segoe UI,Arial,sans-serif;color:#222;max-width:800px'><h2>Alerta de errores - Integracion AS/400 -> SAP</h2><p style='color:#777'>Lote: {lote['procesado_utc']}</p><div style='background:#f8f9fa;border:1px solid #e1e4e8;border-radius:6px;padding:14px;margin:12px 0'><strong>Total errores:</strong> {lote['total_errores']} | <strong>Clientes afectados:</strong> {lote['clientes_afectados']}<br><strong>Archivo:</strong> <code>{lote['key']}</code></div>{nb}<h3>Resumen por categoria</h3><table style='border-collapse:collapse;width:100%;font-size:14px'><thead><tr style='background:#2c3e50;color:#fff'><th style='padding:8px 10px;text-align:left'>Categoria</th><th style='padding:8px 10px;text-align:right'>Conteo</th><th style='padding:8px 10px;text-align:left'>Severidad</th><th style='padding:8px 10px;text-align:left'>Equipo</th><th style='padding:8px 10px;text-align:right'>Clientes</th></tr></thead><tbody>{cr}</tbody></table>{runbooks_html(sm)}{ss}<h3>Top clientes afectados</h3><table style='border-collapse:collapse;width:100%;font-size:14px'><thead><tr style='background:#2c3e50;color:#fff'><th style='padding:8px 10px;text-align:left'>Cliente</th><th style='padding:8px 10px;text-align:right'>Docs</th><th style='padding:8px 10px;text-align:left'>Categorias</th></tr></thead><tbody>{clr}</tbody></table><p style='margin-top:16px'><a href='{url}' style='color:#2980b9'>Ver archivo en S3</a></p><hr style='border:none;border-top:1px solid #eee'><p style='color:#999;font-size:12px'>Generado automaticamente por el sistema de alertas AS/400 -> SAP.</p></body></html>"
          def text(sm,n):
            lote=sm["lote"]; L=["Alerta errores AS/400 -> SAP",f"Lote: {lote['procesado_utc']}",f"Total: {lote['total_errores']} | Clientes: {lote['clientes_afectados']}",f"Archivo: {lote['key']}"]
            if n: L+=["",n]
            L+=["","Por categoria:"]
            for c in sm["categorias"]: L.append(f"  - {c['categoria']}: {c['conteo']} [{c['severidad']}] ({c['equipo']})")
            L+=["","Procedimiento de solucion por causa raiz:"]
            for c in sm["categorias"]:
              sol=c.get("solucion",{}); L.append(f"  * {c['categoria']} -> responsable: {sol.get('area_responsable','-')}"); L.append(f"    sistemas: {sol.get('sistemas','-')}")
              for i,p in enumerate(sol.get("pasos",[]),1): L.append(f"      {i}. {p}")
            L.append(""); L.append(f"Stock/ATP: {sm.get('alerta_stock',{}).get('conteo',0)} docs")
            return "\n".join(L)
          def handler(event,context):
            if not SENDER or not RECIP: raise RuntimeError("SES_SENDER y SES_RECIPIENT requeridos")
            for rec in event.get("Records",[]):
              sm=json.loads(rec["Sns"]["Message"])
              nt,o=narr_ia(sm)
              tot=sm["lote"]["total_errores"]; fn=sm["lote"]["key"].split("/")[-1]
              ses.send_email(Source=SENDER,Destination={"ToAddresses":[RECIP]},Message={"Subject":{"Data":f"[AS400->SAP] {tot} errores - {fn}","Charset":"UTF-8"},"Body":{"Text":{"Data":text(sm,nt),"Charset":"UTF-8"},"Html":{"Data":html(sm,narr_html(nt,o)),"Charset":"UTF-8"}}})
              logger.info("Correo enviado narrativa=%s",o)
            return {"statusCode":200}

  # --- SNS -> Lambda formateadora ---
  EmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: lambda
      TopicArn: !Ref AlertTopic
      Endpoint: !GetAtt EmailFunction.Arn

  EmailInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EmailFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref AlertTopic

  # --- Permiso para que S3 invoque la Lambda analizadora ---
  S3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AnalyzerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::${RawBucketName}"

  # --- CloudWatch: alarma de errores criticos ---
  CriticalAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-errores-criticos"
      AlarmDescription: Dispara cuando hay errores CRITICOS de integracion (partner functions / datos cliente).
      Namespace: !Ref MetricNamespace
      MetricName: ErroresPorCategoria
      Dimensions:
        - Name: Categoria
          Value: PARTNER_FUNCTIONS_FALTANTES
        - Name: Severidad
          Value: CRITICA
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref CriticalThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

# ---------------------------------------------------------------------------
Outputs:
  AnalyzerFunctionArn:
    Description: ARN de la Lambda analizadora (configurar notificacion S3 hacia aqui).
    Value: !GetAtt AnalyzerFunction.Arn
  AlertTopicArn:
    Description: ARN del topic SNS de alertas.
    Value: !Ref AlertTopic
  EmailFunctionArn:
    Description: ARN de la Lambda formateadora de correo.
    Value: !GetAtt EmailFunction.Arn
  NotaConfiguracionS3:
    Description: Paso manual requerido tras el deploy.
    Value: !Sub "Configurar notificacion ObjectCreated en el bucket ${RawBucketName} prefijo ${ErrorPrefix} -> invocar la Lambda analizadora."
